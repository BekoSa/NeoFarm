# The UI talks to the API through this same origin, so one prebuilt image
# works on any host/IP without rebuilding with VITE_API_BASE.
upstream farm_api {
    server server:5000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location ~ ^/(api/|ws$|health$|install) {
        proxy_pass http://farm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;   # long-lived WebSocket feed
    }

    location / {
        try_files $uri /index.html;
    }
}
