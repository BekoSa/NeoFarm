name: farm

# Prebuilt images come from GitHub Container Registry (built by CI):
#   docker compose pull && docker compose up -d
# or build locally from this checkout:
#   docker compose up -d --build
x-server-image: &server-image ${FARM_IMAGE_REPO:-ghcr.io/bekosa/neofarm}-server:${FARM_TAG:-latest}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farm}
      POSTGRES_USER: ${POSTGRES_USER:-farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: *server-image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-farm}
      POSTGRES_USER: ${POSTGRES_USER:-farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farm}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-10}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-20}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FARM_API_TOKEN: ${FARM_API_TOKEN:?set FARM_API_TOKEN in .env}
      FARM_HOST: 0.0.0.0
      FARM_PORT: 5000
      FARM_CONFIG: /app/config.yml
      FARM_CORS_ORIGINS: ${FARM_CORS_ORIGINS:-*}
      FARM_ROLE: api
    command: ["uvicorn", "farm.main:app", "--host", "0.0.0.0", "--port", "5000"]
    volumes:
      - ./config.yml:/app/config.yml
      # Host code wins over the image: edit a protocol in server/farm/protocols/
      # and `docker compose restart server submitter` — no rebuild needed.
      # (New Python dependencies still need `docker compose up --build`.)
      - ./server/farm:/app/farm
    ports:
      - "5000:5000"

  submitter:
    image: *server-image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-farm}
      POSTGRES_USER: ${POSTGRES_USER:-farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farm}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-10}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-20}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FARM_CONFIG: /app/config.yml
      FARM_ROLE: submitter
    command: ["python", "-m", "farm.workers.submitter"]
    volumes:
      - ./config.yml:/app/config.yml
      - ./server/farm:/app/farm

  expirer:
    image: *server-image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-farm}
      POSTGRES_USER: ${POSTGRES_USER:-farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farm}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-10}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-20}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FARM_CONFIG: /app/config.yml
      FARM_ROLE: expirer
    command: ["python", "-m", "farm.workers.expirer"]
    volumes:
      - ./config.yml:/app/config.yml
      - ./server/farm:/app/farm

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = the UI talks to its own origin; nginx proxies to `server`.
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: ${FARM_IMAGE_REPO:-ghcr.io/bekosa/neofarm}-frontend:${FARM_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
