# =============================================================================
# Farm configuration — AltayCTF (HTTP jury).
# Hot-reloaded by every service: save from the UI or edit this file, no
# restart. A broken edit is ignored and the last good config stays active.
# Lines marked CHECK are guesses — confirm them from the game rules.
# =============================================================================

# Regex used to extract flags from exploit stdout.
# CHECK: the real AltayCTF flag alphabet/length (the jury flags start "alt_").
flag_format: '[aA][lL][tT]_[A-Za-z0-9]{26}'

# Flag time-to-live, seconds. Older unsubmitted flags become EXPIRED.
flag_lifetime: 240              # CHECK: from the rules

# Round duration, seconds. Clients launch exploits once per round.
round_length: 60                # CHECK: from the rules

# Submission protocol — a file stem under server/farm/protocols/.
protocol: altayctf_http

# Per-protocol settings, forwarded to the protocol class as kwargs.
protocols:
  altayctf_http:
    # POST <url>/api/v1/flags  {"flags": [...]}
    url: http://10.80.80.10
    timeout: 5
    # headers: {X-Team-Token: "..."}   # only if the jury asks for auth
  altayctf_tcp:
    # Fallback: one flag per line over raw TCP.
    host: 10.80.80.10
    port: 3333
    timeout: 5
  ctf01d:
    url: http://10.10.100.100
    team_id: t10
    timeout: 5
  dummy:
    accept_rate: 1.0

# The submitter sends up to `batch_size` flags at most every `period`
# seconds; while the queue is empty it checks every `idle_period` seconds.
submitter:
  period: 5
  idle_period: 0.5
  batch_size: 100

# Teams. Explicit `{alias, ip}` entries and/or ranges where {i} is the team
# number ({i:02d} zero-pads). Later entries win on alias clash.
teams:
  - from: 1
    to: 22
    alias: team-{i:02d}
    ip: 10.40.{i}.10
exclude_teams:                  # CHECK: e.g. ["team-10"]

# Exploit run reports older than this many seconds are purged (0 = keep).
  - team-10
runs_retention: 7200
